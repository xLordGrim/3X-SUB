name: Build Custom 3x-ui
on:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Specific 3x-ui version tag to build (e.g., v3.0.0). Leave empty for latest.'
        required: false
        type: string
  push:
    branches:
      - development
      - main
  schedule:
    # Check every 30 minutes for new 3x-ui releases
    - cron: '*/30 * * * *'

jobs:
  check-update:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      xui_tag: ${{ steps.check.outputs.xui_tag }}
    steps:
      - name: Check latest 3x-ui version
        id: check
        run: |
          TARGET_VERSION="${{ github.event.inputs.target_version }}"
          if [[ -n "$TARGET_VERSION" ]]; then
            LATEST_TAG="$TARGET_VERSION"
            LATEST_VER=$(echo "$LATEST_TAG" | sed 's/^v//')
            echo "Manual target version: $LATEST_VER"
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "xui_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get the latest 3x-ui release tag
          LATEST_TAG=$(curl -sL https://api.github.com/repos/MHSanaei/3x-ui/releases/latest | jq -r '.tag_name')
          LATEST_VER=$(echo "$LATEST_TAG" | sed 's/^v//')
          echo "Latest 3x-ui version: $LATEST_VER"

          # Get our last built version from the latest release body
          OUR_TAG=$(curl -sL https://api.github.com/repos/${{ github.repository }}/releases/latest 2>/dev/null | jq -r '.body // ""' | grep -oP 'xui-version: \K.*' || echo "")
          echo "Our last built version: $OUR_TAG"

          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            if [[ "$LATEST_VER" != "$OUR_TAG" && "$LATEST_VER" != "" ]]; then
              echo "New version detected! Triggering rebuild."
              echo "should_build=true" >> $GITHUB_OUTPUT
            else
              echo "No new version. Skipping."
              echo "should_build=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "Manual or push event. Triggering rebuild."
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi
          echo "xui_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: [check-update]
    if: needs.check-update.outputs.should_build == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout 3X-SUB
        uses: actions/checkout@v4
        with:
          path: 3X-SUB

      - name: Checkout 3x-ui (latest stable)
        uses: actions/checkout@v4
        with:
          repository: MHSanaei/3x-ui
          path: 3x-ui
          ref: ${{ needs.check-update.outputs.xui_tag }}

      - name: Detect 3x-ui version & toolchains
        id: version
        run: |
          if [ -f "3x-ui/internal/config/version" ]; then
            XUI_VER=$(cat 3x-ui/internal/config/version | tr -d '[:space:]')
          else
            XUI_VER=$(cat 3x-ui/config/version | tr -d '[:space:]')
          fi
          echo "xui_version=$XUI_VER" >> $GITHUB_OUTPUT

          BRANCH="${GITHUB_REF_NAME:-development}"
          if [[ "$BRANCH" == "main" ]]; then
            echo "release_tag=v${XUI_VER}" >> $GITHUB_OUTPUT
            echo "release_name=3X-SUB v${XUI_VER}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "release_tag=v${XUI_VER}-dev" >> $GITHUB_OUTPUT
            echo "release_name=3X-SUB v${XUI_VER}-dev" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

          # Dynamically detect Node.js version with backward compatibility fallbacks
          if [ -f "3x-ui/.nvmrc" ]; then
            NODE_VER=$(cat 3x-ui/.nvmrc | tr -d '[:space:]')
          elif [ -f "3x-ui/frontend/package.json" ]; then
            NODE_VER=$(grep -oP '"node":\s*">\=\K[0-9]+' 3x-ui/frontend/package.json || echo "")
            if [ -z "$NODE_VER" ]; then
              NODE_VER="22"
            fi
          else
            NODE_VER="22"
          fi
          echo "node_version=$NODE_VER" >> $GITHUB_OUTPUT

          # Dynamically detect Go version with backward compatibility fallbacks
          if [ -f "3x-ui/go.mod" ]; then
            GO_VER=$(grep -E '^go [0-9]' 3x-ui/go.mod | awk '{print $2}' | tr -d '[:space:]')
          else
            GO_VER="1.22"
          fi
          echo "go_version=$GO_VER" >> $GITHUB_OUTPUT

          echo "--- Toolchain & Version Info ---"
          echo "3x-ui version: $XUI_VER"
          echo "Branch:        $BRANCH"
          echo "Resolved Node: $NODE_VER"
          echo "Resolved Go:   $GO_VER"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.version.outputs.node_version }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.version.outputs.go_version }}
          check-latest: true

      - name: Inject 3X-SUB Theme (external CDN links)
        run: |
          RELEASE_TAG="${{ steps.version.outputs.release_tag }}"
          BRANCH="${{ steps.version.outputs.branch }}"
          
          # Always use commit SHA to bypass CDN caching issues completely
          ASSET_VERSION="${{ github.sha }}"

          CSS_URL="https://cdn.jsdelivr.net/gh/xLordGrim/3X-SUB@${ASSET_VERSION}/web/assets/css/premium.css"
          JS_URL="https://cdn.jsdelivr.net/gh/xLordGrim/3X-SUB@${ASSET_VERSION}/web/assets/js/subscription.js"
          EXT_JS_URL="https://cdn.jsdelivr.net/gh/xLordGrim/3X-SUB@${ASSET_VERSION}/web/assets/js/subscription-v37.js"

          echo "CDN pinned to: $ASSET_VERSION"
          echo "CSS:     $CSS_URL"
          echo "JS:      $JS_URL"
          echo "EXT_JS:  $EXT_JS_URL"

          python3 << PYEOF
          import re, os
          css_url = "${CSS_URL}"
          js_url = "${JS_URL}"
          ext_js_url = "${EXT_JS_URL}"

          subpage_path = '3x-ui/frontend/subpage.html'
          legacy_subpage_path = '3x-ui/web/html/settings/panel/subscription/subpage.html'

          target_file = None
          if os.path.exists(subpage_path):
              target_file = subpage_path
          elif os.path.exists(legacy_subpage_path):
              target_file = legacy_subpage_path

          if not target_file:
              print("WARNING: subpage.html not found, skipping patching")
              exit(0)

          with open(target_file, 'r', encoding='utf-8') as f:
              content = f.read()

          if target_file == subpage_path:
              # Strip stock Vue/React app tags to prevent 404 errors
              content = re.sub(r'<script type="module"[^>]*src="[^"]*subpage[^"]*"[^>]*></script>\s*', '', content)
              content = re.sub(r'<link rel="modulepreload"[^>]*>\s*', '', content)
              content = re.sub(r'<link rel="stylesheet" crossorigin[^>]*>\s*', '', content)

          # Inject CDN links
          head_inject = f'<link rel="stylesheet" href="{css_url}">\n  </head>'
          body_inject = f'''  <script>
              document.addEventListener('DOMContentLoaded', function() {{
                document.body.classList.add('premium-theme');
                var app = document.getElementById('app');
                if (app) app.style.display = 'none';
              }});
            </script>
            <script>window.__DEFAULT_LANG__="en";</script>
            <script src="{js_url}"></script>
            <script src="{ext_js_url}"></script>
            </body>'''

          if '</head>' in content:
              content = content.replace('</head>', head_inject, 1)
          else:
              content = head_inject + content

          if '</body>' in content:
              content = content.replace('</body>', body_inject, 1)
          else:
              content = content + body_inject

          with open(target_file, 'w', encoding='utf-8') as f:
              f.write(content)
          print(f"OK: {target_file} patched")
          PYEOF

          if [ -f "3x-ui/frontend/subpage.html" ]; then
            cat 3x-ui/frontend/subpage.html
          fi

      - name: Inject isolated sub_stats route into Go backend
        run: |
          WEB_GO_FILE=$(find 3x-ui -type f -name "web.go" | grep -v "/vendor/" | head -n 1)
          if [ -n "$WEB_GO_FILE" ]; then
            if grep -q 'sub_stats' "$WEB_GO_FILE"; then
              echo "sub_stats already present in $WEB_GO_FILE"
            else
              echo "Patching $WEB_GO_FILE to include sub_stats static route..."
              sed -i 's|return engine, nil|engine.StaticFS(basePath+"sub_stats", http.Dir("/usr/local/x-ui/sub_stats"))\n\treturn engine, nil|g' "$WEB_GO_FILE"
              echo "OK: sub_stats route injected into web.go"
            fi
          else
            echo "WARNING: web.go not found! Cannot inject sub_stats route."
          fi

          SUB_GO_FILE=$(find 3x-ui -type f -name "sub.go" | grep -v "/vendor/" | head -n 1)
          if [ -n "$SUB_GO_FILE" ]; then
            if grep -q 'sub_stats' "$SUB_GO_FILE"; then
              echo "sub_stats already present in $SUB_GO_FILE"
            else
              echo "Patching $SUB_GO_FILE to include sub_stats static route..."
              sed -i 's|return engine, nil|engine.StaticFS(basePath+"sub_stats", http.Dir("/usr/local/x-ui/sub_stats"))\n\treturn engine, nil|g' "$SUB_GO_FILE"
              echo "OK: sub_stats route injected into sub.go"
            fi
          else
            echo "WARNING: sub.go not found! Cannot inject sub_stats route into sub.go."
          fi

      - name: Build Frontend
        run: |
          if [ -d "3x-ui/frontend" ]; then
            cd 3x-ui/frontend
            npm ci || npm install
            npm run build
          else
            echo "No frontend/ directory found (legacy 3x-ui), skipping frontend build."
          fi

      - name: Verify dist
        run: |
          echo "--- subpage.html in dist ---"
          DIST_PATH=""
          if [ -f "3x-ui/internal/web/dist/subpage.html" ]; then
            DIST_PATH="3x-ui/internal/web/dist/subpage.html"
          elif [ -f "3x-ui/web/dist/subpage.html" ]; then
            DIST_PATH="3x-ui/web/dist/subpage.html"
          fi

          if [ -n "$DIST_PATH" ]; then
            cat "$DIST_PATH"
            grep -c "cdn.jsdelivr.net" "$DIST_PATH" && echo "✓ CDN links present" || echo "✗ CDN links MISSING"
          else
            echo "Notice: dist/subpage.html not found, skipping."
          fi

      - name: Install Cross-Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build Go Binary (AMD64)
        working-directory: 3x-ui
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o x-ui-linux-amd64 main.go

      - name: Build Go Binary (ARM64)
        working-directory: 3x-ui
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC=aarch64-linux-gnu-gcc go build -ldflags "-s -w" -o x-ui-linux-arm64 main.go

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: custom-x-ui-binaries
          path: |
            3x-ui/x-ui-linux-amd64
            3x-ui/x-ui-linux-arm64

      - name: Delete existing release
        run: gh release delete ${{ steps.version.outputs.release_tag }} --cleanup-tag -y || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: ${{ steps.version.outputs.release_name }}
          make_latest: ${{ steps.version.outputs.prerelease == 'false' }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          body: |
            Custom 3x-ui binary with [3X-SUB](https://github.com/xLordGrim/3X-SUB) premium subscription theme.

            **Base:** 3x-ui v${{ steps.version.outputs.xui_version }}
            **Channel:** ${{ steps.version.outputs.branch }}

            xui-version: ${{ steps.version.outputs.xui_version }}
          files: |
            3x-ui/x-ui-linux-amd64
            3x-ui/x-ui-linux-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
